name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r server/requirements.txt
      - run: python -m pytest -q server/tests

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check scripts
        run: for f in extension/src/*.js; do node --check "$f"; done
      - name: Build both targets
        run: extension/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: extension/dist/*.zip
          retention-days: 14
