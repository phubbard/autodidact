<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autodidact</title>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1a1a1a; --muted: #6b7280; --bg: #ffffff; --card: #f6f7f9; --accent: #2563eb; --mark: #fde68a;
      font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e5e7eb; --muted: #9ca3af; --bg: #111214; --card: #1b1d21; --accent: #60a5fa; --mark: #78350f; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg); }
    main { max-width: 820px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
    h1 { font-size: 1.1rem; margin: 0 0 1rem; display: flex; justify-content: space-between; align-items: baseline; }
    h1 small { color: var(--muted); font-weight: 400; font-size: .8rem; }
    h1 small a { color: var(--muted); }
    form { display: grid; grid-template-columns: 1fr; gap: .5rem; }
    .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
    input[type=search] { flex: 1; font: inherit; font-size: 1.05rem; padding: .6rem .8rem; border: 1px solid var(--muted); border-radius: 8px; background: var(--card); color: var(--fg); }
    input[type=date], input[type=text] { font: inherit; padding: .4rem .5rem; border: 1px solid var(--muted); border-radius: 6px; background: var(--card); color: var(--fg); }
    label { color: var(--muted); font-size: .85rem; }
    .chips { display: flex; gap: .4rem; flex-wrap: wrap; }
    .chip { font-size: .8rem; padding: .2rem .6rem; border-radius: 999px; border: 1px solid var(--muted); background: transparent; color: var(--fg); cursor: pointer; }
    .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    #meta { color: var(--muted); font-size: .85rem; margin: 1rem 0 .5rem; }
    .hit { background: var(--card); border-radius: 10px; padding: .8rem 1rem; margin-bottom: .6rem; }
    .hit a.title { font-weight: 600; color: var(--accent); text-decoration: none; font-size: 1rem; }
    .hit .url { color: var(--muted); font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hit .snip { margin: .4rem 0; line-height: 1.45; font-size: .93rem; }
    .hit .foot { color: var(--muted); font-size: .8rem; display: flex; gap: 1rem; flex-wrap: wrap; }
    .hit .foot a { color: var(--muted); }
    mark { background: var(--mark); color: inherit; padding: 0 .1em; border-radius: 2px; }
    button.ask { font: inherit; padding: .55rem 1rem; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
    button.ask:disabled { opacity: .6; cursor: progress; }
    #answer { background: var(--card); border-left: 3px solid var(--accent); border-radius: 10px; padding: .9rem 1rem; margin: 1rem 0 .5rem; line-height: 1.5; }
    #answer .who { color: var(--muted); font-size: .8rem; margin-bottom: .4rem; }
    #answer .err { color: var(--muted); }
    #answer ol { margin: .6rem 0 0; padding-left: 1.3rem; font-size: .85rem; }
    #answer ol a { color: var(--accent); text-decoration: none; }
    #answer sup a { color: var(--accent); text-decoration: none; font-weight: 600; }
    button.more { font: inherit; padding: .5rem 1rem; border-radius: 8px; border: 1px solid var(--muted); background: var(--card); color: var(--fg); cursor: pointer; }
  </style>
</head>
<body>
<main>
  <h1>Autodidact <small><span id="stats"></span> · <a href="/debug">debug</a></small></h1>
  <form id="f">
    <div class="row">
      <input type="search" id="q" placeholder="What do you half-remember?" autofocus autocomplete="off">
      <button type="button" id="ask" class="ask" title="Answer from your archive (⌘↩)">Ask</button>
    </div>
    <div class="row">
      <div class="chips" id="chips">
        <button type="button" class="chip on" data-days="">any time</button>
        <button type="button" class="chip" data-days="7">week</button>
        <button type="button" class="chip" data-days="31">month</button>
        <button type="button" class="chip" data-days="92">3 months</button>
        <button type="button" class="chip" data-days="365">year</button>
      </div>
      <label>from <input type="date" id="after"></label>
      <label>to <input type="date" id="before"></label>
      <label>site <input type="text" id="domain" placeholder="example.com" size="14"></label>
      <div class="chips" id="sources">
        <button type="button" class="chip on" data-source="">all</button>
        <button type="button" class="chip" data-source="web">browser</button>
        <button type="button" class="chip" data-source="rss">rss</button>
        <button type="button" class="chip" data-source="news">news</button>
        <button type="button" class="chip" data-source="shared">shared</button>
      </div>
    </div>
  </form>
  <div id="answer" hidden></div>
  <div id="meta"></div>
  <div id="results"></div>
  <button class="more" id="more" hidden>More</button>
</main>
<script>
const $ = (s) => document.querySelector(s);
const PAGE = 25;
let offset = 0, lastQuery = null, debounce = null;

function params() {
  const p = new URLSearchParams();
  const q = $('#q').value.trim();
  if (q) p.set('q', q);
  if ($('#after').value) p.set('after', $('#after').value);
  if ($('#before').value) p.set('before', $('#before').value);
  if ($('#domain').value.trim()) p.set('domain', $('#domain').value.trim());
  const src = document.querySelector('#sources .chip.on')?.dataset.source;
  if (src) p.set('source', src);
  p.set('limit', PAGE);
  p.set('offset', offset);
  return p;
}

function esc(s) { return (s || '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function snip(s) { return esc(s).replace(/&lt;mark&gt;/g, '<mark>').replace(/&lt;\/mark&gt;/g, '</mark>'); }
function mins(s) { return s < 60 ? s + 's' : Math.round(s / 60) + 'm'; }

function render(hits, append) {
  const box = $('#results');
  if (!append) box.innerHTML = '';
  for (const h of hits) {
    const el = document.createElement('div');
    el.className = 'hit';
    const when = h.first_seen_iso.slice(0, 10) === h.last_seen_iso.slice(0, 10)
      ? h.last_seen_iso.slice(0, 10)
      : `${h.first_seen_iso.slice(0, 10)} → ${h.last_seen_iso.slice(0, 10)}`;
    el.innerHTML = `
      <a class="title" href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.title || h.url)}</a>
      <div class="url">${esc(h.url)}</div>
      <div class="snip">${snip(h.snippet)}</div>
      <div class="foot">
        <span>${esc(h.domain)}</span>
        ${h.source === 'rss' ? `<span>rss · ${esc(h.feed || '')}</span>` : h.source === 'news' ? '<span>apple news</span>' : h.source === 'shared' ? '<span>shared</span>' : ''}
        ${h.match === 'semantic' ? '<span title="Matched on meaning; none of your words are in it">related</span>' : ''}
        <span>${when}</span>
        <span>${h.source === 'web' ? `${h.visit_count} visit${h.visit_count === 1 ? '' : 's'}, ${mins(h.total_dwell_s)}` : `${h.visit_count} ${h.source === 'rss' ? 'sync' : 'share'}${h.visit_count === 1 ? '' : 's'}`}</span>
        <a href="/page/${h.id}?format=html" target="_blank">stored text</a>
      </div>`;
    box.appendChild(el);
  }
}

async function run(append = false) {
  if (!append) offset = 0;
  const p = params();
  const key = p.toString();
  if (!append && key === lastQuery) return;
  lastQuery = key;
  const r = await fetch('/search?' + key);
  const data = await r.json();
  render(data.results, append);
  const n = data.results.length;
  if (!append) {
    $('#meta').textContent = data.mode === 'recent'
      ? 'Recent pages'
      : `${n}${n === PAGE ? '+' : ''} result${n === 1 ? '' : 's'}${data.mode === 'any' ? ' (matching any word)' : data.mode === 'hybrid' ? ' (words and meaning)' : ''}`;
  }
  $('#more').hidden = n < PAGE;
  if (n === PAGE) offset += PAGE;
  history.replaceState(null, '', '?' + key);
}

// Ask: an answer written by the LLM on Axiom from the best-matching passages, citing them.
function answerHtml(text, sources) {
  const byN = Object.fromEntries(sources.map((s) => [s.n, s]));
  return esc(text)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\[(\d+)\]/g, (m, n) => byN[n] ? `<sup><a href="/page/${byN[n].id}?format=html" title="${esc(byN[n].title)}">${n}</a></sup>` : m)
    .replace(/\n/g, '<br>');
}
async function ask() {
  const q = $('#q').value.trim();
  if (q.length < 3) return;
  const p = params(); p.delete('limit'); p.delete('offset');
  const box = $('#answer');
  box.hidden = false;
  box.innerHTML = '<div class="who">Asking Axiom…</div>';
  $('#ask').disabled = true;
  try {
    const d = await (await fetch('/ask?' + p)).json();
    const list = d.sources.length ? '<ol>' + d.sources.map((s) =>
      `<li><a href="/page/${s.id}?format=html">${esc(s.title)}</a> <span class="who">${esc(s.domain)} · ${esc(s.first_seen_iso.slice(0, 10))}</span></li>`).join('') + '</ol>' : '';
    box.innerHTML = d.answer
      ? `<div class="who">${esc(d.model || '')} · ${((d.ms || 0) / 1000).toFixed(1)} s</div>${answerHtml(d.answer, d.sources)}${list}`
      : `<div class="err">${esc(d.error || 'No answer.')}</div>${list}`;
  } catch (e) {
    box.innerHTML = `<div class="err">Ask failed: ${esc(String(e))}</div>`;
  } finally {
    $('#ask').disabled = false;
  }
}
$('#ask').addEventListener('click', ask);
$('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); ask(); } });

$('#f').addEventListener('submit', (e) => { e.preventDefault(); run(); });
$('#q').addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(run, 250); });
for (const id of ['after', 'before', 'domain']) $('#' + id).addEventListener('change', () => run());
$('#more').addEventListener('click', () => run(true));
$('#sources').addEventListener('click', (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  document.querySelectorAll('#sources .chip').forEach((c) => c.classList.remove('on'));
  b.classList.add('on');
  run();
});
$('#chips').addEventListener('click', (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  document.querySelectorAll('#chips .chip').forEach((c) => c.classList.remove('on'));
  b.classList.add('on');
  if (b.dataset.days) {
    const d = new Date(); d.setDate(d.getDate() - Number(b.dataset.days));
    $('#after').value = d.toISOString().slice(0, 10);
    $('#before').value = '';
  } else { $('#after').value = ''; $('#before').value = ''; }
  run();
});

// Restore state from the URL, then run.
const init = new URLSearchParams(location.search);
for (const id of ['q', 'after', 'before', 'domain']) if (init.get(id)) $('#' + id).value = init.get(id);
if (init.get('source')) {
  document.querySelectorAll('#sources .chip').forEach((c) => c.classList.toggle('on', c.dataset.source === init.get('source')));
}
fetch('/stats').then((r) => r.json()).then((s) => {
  $('#stats').textContent = `${s.pages.toLocaleString()} pages · ${s.domains.toLocaleString()} sites · ${(s.db_bytes / 1048576).toFixed(0)} MB`;
});
run();
</script>
</body>
</html>
